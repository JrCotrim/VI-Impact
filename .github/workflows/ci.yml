name: Continuous Integration

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore backend dependencies
        run: dotnet restore VIImpact.slnx

      - name: Build backend
        run: >-
          dotnet build VIImpact.slnx
          --configuration Release
          --no-restore

      - name: Run backend tests
        run: >-
          dotnet test VIImpact.slnx
          --configuration Release
          --no-build
          --verbosity normal

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: VIImpact.Web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: VIImpact.Web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  compose:
    name: Build and smoke test Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      POSTGRES_PASSWORD: CI_StrongPassword_2026!
      TWELVE_DATA_API_KEY: ci-placeholder-key
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      STOCK_COLLECTION_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build and start Docker Compose stack
        run: docker compose up --detach --build --wait --wait-timeout 180

      - name: Smoke test API readiness
        run: curl --fail --silent --show-error http://localhost:5170/health/ready

      - name: Smoke test public GTA events endpoint
        run: curl --fail --silent --show-error http://localhost:5170/api/gtaevents > /dev/null

      - name: Show Docker Compose status on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
