name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore backend dependencies
        run: dotnet restore VIImpact.slnx

      - name: Build backend
        run: >-
          dotnet build VIImpact.slnx
          --configuration Release
          --no-restore

      - name: Run backend tests
        run: >-
          dotnet test VIImpact.slnx
          --configuration Release
          --no-build
          --verbosity normal

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: VIImpact.Web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Install frontend dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      SQL_SA_PASSWORD: CI_StrongPassword_2026!
      TWELVE_DATA_API_KEY: ci-placeholder-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet