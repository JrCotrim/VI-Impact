services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Defina SQL_SA_PASSWORD no arquivo .env}
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd
          -S localhost
          -U sa
          -P "$${MSSQL_SA_PASSWORD}"
          -C
          -Q "SELECT 1"
          -b
          -o /dev/null
      interval: 10s
      timeout: 5s
      start_period: 25s
      retries: 10

  api:
    image: viimpact-api:local
    restart: unless-stopped
    build:
      context: .
      dockerfile: VIImpact.API/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: >-
        Server=sqlserver,1433;
        Database=VIImpactDb;
        User Id=sa;
        Password=${SQL_SA_PASSWORD};
        Encrypt=True;
        TrustServerCertificate=True
      TwelveData__ApiKey: ${TWELVE_DATA_API_KEY:?Defina TWELVE_DATA_API_KEY no arquivo .env}
      TwelveData__BaseUrl: ${TWELVE_DATA_BASE_URL:-https://api.twelvedata.com}
      StockCollection__Enabled: ${STOCK_COLLECTION_ENABLED:-true}
      StockCollection__Symbol: ${STOCK_SYMBOL:-TTWO}
      StockCollection__IntervalMinutes: ${STOCK_INTERVAL_MINUTES:-5}
    ports:
      - "${API_PORT:-5170}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://localhost:8080/health/ready
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 8

  web:
    image: viimpact-web:local
    restart: unless-stopped
    build:
      context: .
      dockerfile: VIImpact.Web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sqlserver-data: