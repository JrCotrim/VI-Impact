services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-VIImpactDb}
      POSTGRES_USER: ${POSTGRES_USER:-viimpact}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in the .env file}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready
          -U "$${POSTGRES_USER}"
          -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 10

  api:
    image: viimpact-api:local
    restart: unless-stopped
    build:
      context: .
      dockerfile: VIImpact.API/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;
        Port=5432;
        Database=${POSTGRES_DB:-VIImpactDb};
        Username=${POSTGRES_USER:-viimpact};
        Password=${POSTGRES_PASSWORD};
        SSL Mode=Disable
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:?Define CORS_ALLOWED_ORIGINS in the .env file}
      TwelveData__ApiKey: ${TWELVE_DATA_API_KEY:?Define TWELVE_DATA_API_KEY in the .env file}
      TwelveData__BaseUrl: ${TWELVE_DATA_BASE_URL:-https://api.twelvedata.com}
      TwelveData__RequestTimeoutSeconds: ${TWELVE_DATA_REQUEST_TIMEOUT_SECONDS:-10}
      TwelveData__MaxRetryAttempts: ${TWELVE_DATA_MAX_RETRY_ATTEMPTS:-2}
      TwelveData__RetryBaseDelayMilliseconds: ${TWELVE_DATA_RETRY_BASE_DELAY_MILLISECONDS:-400}
      TwelveData__MaximumRetryDelaySeconds: ${TWELVE_DATA_MAXIMUM_RETRY_DELAY_SECONDS:-5}
      TwelveData__CircuitBreakerFailureThreshold: ${TWELVE_DATA_CIRCUIT_BREAKER_FAILURE_THRESHOLD:-3}
      TwelveData__CircuitBreakerDurationSeconds: ${TWELVE_DATA_CIRCUIT_BREAKER_DURATION_SECONDS:-30}
      StockCollection__Enabled: ${STOCK_COLLECTION_ENABLED:-true}
      StockCollection__Symbol: ${STOCK_SYMBOL:-TTWO}
      StockCollection__IntervalMinutes: ${STOCK_INTERVAL_MINUTES:-5}
    ports:
      - "${API_PORT:-5170}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://localhost:8080/health/ready
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 8

  web:
    image: viimpact-web:local
    restart: unless-stopped
    build:
      context: .
      dockerfile: VIImpact.Web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
